- name: Python
  hosts: 127.0.0.1
  connection: local

  tasks:
    - name: Install core dependencies
      become: yes
      apt:
        package: "{{ item }}"
      loop:
        - build-essential
        - libffi-dev
        - libssl-dev
        - zlib1g-dev
        - libbz2-dev
        - libreadline-dev
        - libsqlite3-dev
        - libncurses5-dev
        - libncursesw5-dev
        - tk-dev
        - liblzma-dev
        - libgdbm-dev
        - libnss3-dev
        - libdb-dev
        - libexpat1-dev
        - libuuid1
        - libgmp-dev
        - libx11-dev
        - libxcb1-dev
        - libx11-xcb-dev
        - libxext-dev
        - libxft-dev
        - libxrender-dev

    - name: Install pyenv
      git:
        dest: ~/.pyenv
        repo: https://github.com/pyenv/pyenv

    - name: Install pyenv-virtualenv
      git:
        dest: ~/.pyenv/plugins/pyenv-virtualenv
        repo: https://github.com/pyenv/pyenv-virtualenv

    - name: Enable pyenv
      blockinfile:
        path: ~/.bashrc
        marker: "### {mark} Ansible managed: pyenv support"
        block: |
          export PYENV_ROOT=$HOME/.pyenv
          export PATH=$PATH:$PYENV_ROOT/bin:$PYENV_ROOT/plugins/pyenv-virtualenv/bin
          eval "$(pyenv init --path)"
          eval "$(pyenv virtualenv-init -)"
