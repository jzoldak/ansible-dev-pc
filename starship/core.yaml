- name: Starship
  hosts: 127.0.0.1
  connection: local

  tasks:
    - name: Install Starship
      homebrew:
        name: starship
        state: present

    - name: Enable Starship in zsh
      blockinfile:
        path: ~/.zshrc
        marker: "### {mark} Ansible managed: Starship"
        block: |
          eval "$(starship init zsh)"
