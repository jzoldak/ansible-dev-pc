- name: Environment variable customization
  hosts: 127.0.0.1
  connection: local

  tasks:
    - name: Install other helpful packages (macOS)
      homebrew:
        name:
          - black
          - broot
          - gh  # GitHub CLI
          - go
          - graphviz
          - ldns  # provides drill (similar to ldnsutils)
          - magic-wormhole
          - nmap
          - pre-commit
          - ripgrep
          - shellcheck
          - speedtest-cli
          - tree
          - whois
          - wireguard-tools
        state: present
